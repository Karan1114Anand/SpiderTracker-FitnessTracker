name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - name: Tag must match pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $v"; exit 1
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Restore signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secrets set: building with the debug key."
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Name the APK and write its checksum
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Spider-Tracker.apk
          cd dist && sha256sum Spider-Tracker.apk > Spider-Tracker.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Spider-Tracker-apk
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Spider-Tracker.apk
            dist/Spider-Tracker.apk.sha256
          generate_release_notes: true
