name: spider_tracker
description: Local-only fitness tracker with points, levels and badges. Your plan comes from any AI assistant or your own hands.
publish_to: none

version: 1.7.0+9

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Local persistence. There is no backend by design.
  sqflite: ^2.4.1
  path: ^1.9.0

  # Weight trend and diet-score history.
  fl_chart: ^0.69.2

  # Theme fonts. IBM Plex is bundled in assets/google_fonts, so nothing is
  # fetched at runtime.
  google_fonts: ^6.2.1
  sqflite_common_ffi_web: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/google_fonts/
